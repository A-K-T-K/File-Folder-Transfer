<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>File Transfer - Server Dashboard</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <script type="module">
        import {
            provideFluentDesignSystem, fluentButton, fluentSwitch, fluentProgress,
            fluentBadge, fluentDivider, fluentTooltip
        } from "https://cdn.jsdelivr.net/npm/@fluentui/web-components@1/dist/web-components.min.js";
        provideFluentDesignSystem().register(
            fluentButton(), fluentSwitch(), fluentProgress(), fluentBadge(), fluentDivider(), fluentTooltip()
        );
    </script>
    <script src="/socket.io/socket.io.js"></script>
    <style>
        :root {
            /* FAST/Fluent shadow-DOM components read this token for their own text —
               setting it explicitly keeps them on the exact same font as the rest of
               the page instead of falling back to a generic default that can render
               differently depending on whether a design-system-provider is present. */
            --body-font: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            --bg-light: #f5f5f5;
            --surface-light: #ffffff;
            --surface2-light: #fafafa;
            --text1-light: #242424;
            --text2-light: #616161;
            --stroke-light: #e0e0e0;
            --accent-light: #0f6cbd;

            --bg-dark: #1b1b1b;
            --surface-dark: #292929;
            --surface2-dark: #202020;
            --text1-dark: #ffffff;
            --text2-dark: #c7c7c7;
            --stroke-dark: #3d3d3d;
            --accent-dark: #479ef5;

            --success: #107c10; --success-dark: #6ccb5f;
            --error: #d13438; --error-dark: #f1707b;
        }
        [data-theme="light"] {
            --bg: var(--bg-light); --surface: var(--surface-light); --surface2: var(--surface2-light);
            --text1: var(--text1-light); --text2: var(--text2-light); --stroke: var(--stroke-light);
            --accent: var(--accent-light); --success-c: var(--success); --error-c: var(--error);
        }
        [data-theme="dark"] {
            --bg: var(--bg-dark); --surface: var(--surface-dark); --surface2: var(--surface2-dark);
            --text1: var(--text1-dark); --text2: var(--text2-dark); --stroke: var(--stroke-dark);
            --accent: var(--accent-dark); --success-c: var(--success-dark); --error-c: var(--error-dark);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            background-color: var(--bg);
            color: var(--text1);
            height: 100vh;
            max-height: 100vh;
            padding: .85rem 1rem;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            gap: .7rem;
            transition: background-color .25s ease, color .25s ease;
        }

        .card {
            padding: .9rem 1.1rem;
            border-radius: 12px;
            background: var(--surface);
            border: 1px solid var(--stroke);
            transition: background-color .25s ease, border-color .25s ease;
            position: relative;
        }

        .top-navbar { display: flex; justify-content: space-between; align-items: center; padding: .5rem .9rem; flex-shrink: 0; }
        .server-brand h1 { color: var(--accent); font-size: 1.1rem; font-weight: 600; }
        #serverNameWrapper { cursor: pointer; padding: 2px 6px; border-radius: 4px; }
        #serverNameWrapper:hover { background: var(--stroke); }
        #serverNameInput { font-family: inherit; font-size: 1.05rem; font-weight: 600; border: none; background: var(--bg); color: var(--text1); padding: 2px 6px; border-radius: 4px; outline: 2px solid var(--accent); }
        .nav-actions { display: flex; align-items: center; gap: .7rem; }

        .main-layout { display: grid; grid-template-columns: 400px 1fr; gap: .7rem; flex-grow: 1; min-height: 0; overflow: hidden; }
        @media (max-width: 890px) { .main-layout { grid-template-columns: 1fr; overflow-y: auto; } }

        .left-col, .right-col { display: flex; flex-direction: column; gap: .7rem; min-height: 0; }
        /* Safety fallback: if content still can't fit a very short/narrow window,
           scroll internally instead of silently clipping (main-layout uses overflow:hidden). */
        .left-col { overflow-y: auto; }

        .connect-box { display: flex; flex-direction: column; align-items: center; gap: .65rem; text-align: center; }
        .qr-wrapper { width: 100%; }
        /* Bound by BOTH width and viewport height — a square image that only respects
           width can end up taller than the window and get clipped by the layout's
           overflow:hidden. width/height:auto with max-width/max-height lets the browser
           shrink to whichever constraint binds first, so it always fits, at any window size. */
        .qr-wrapper img { width: auto; height: auto; max-width: 100%; max-height: clamp(120px, 32vh, 300px); border-radius: 12px; display: block; margin: 0 auto; background: #fff; padding: 6px; border: 1px solid var(--stroke); }
        .connect-details { display: flex; flex-direction: column; align-items: center; gap: .4rem; min-width: 0; }
        fluent-badge.speed-badge { width: fit-content; }
        .url-text { font-size: .8rem; color: var(--text2); line-height: 1.3; word-break: break-all; }
        .url-text strong { color: var(--text1); font-weight: 600; }

        .pin-pill { display: inline-flex; align-items: center; gap: .4rem; padding: .3rem .65rem; border-radius: 6px; cursor: pointer; width: fit-content; font-size: .85rem; }
        .pin-pill:hover { background: var(--bg); }
        .pin-pill span { font-weight: 700; letter-spacing: 1.5px; color: var(--accent); }
        #pinInput { font-family: inherit; font-size: .9rem; font-weight: 700; border: none; background: var(--bg); color: var(--text1); padding: 2px 4px; border-radius: 4px; outline: 2px solid var(--accent); width: 4.3rem; text-align: center; }


        .section-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem; }
        .section-header h2 { font-size: .85rem; font-weight: 600; color: var(--text1); }

        .select-input { width: 100%; padding: .45rem .6rem; border-radius: 8px; border: 1px solid var(--stroke); background: var(--bg); color: var(--text1); font-family: inherit; font-size: .78rem; outline: none; }

        .dir-row { display: flex; align-items: center; justify-content: space-between; gap: .5rem; background: var(--bg); padding: .45rem .6rem; border-radius: 8px; font-size: .78rem; }
        .dir-path { flex-grow: 1; word-break: break-all; cursor: pointer; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        #directoryInput { font-family: inherit; font-size: .78rem; border: none; background: transparent; color: var(--text1); outline: 2px solid var(--accent); width: 100%; }

        #connectedClientsList { display: flex; flex-wrap: wrap; gap: .4rem; list-style: none; max-height: 68px; overflow-y: auto; }
        #connectedClientsList .no-clients { color: var(--text2); font-size: .78rem; }
        #connectedClientsList li { display: inline-flex; align-items: center; gap: .2rem; }
        .send-files-btn { min-width: 0; }
        .send-files-btn svg { width: .85rem; height: .85rem; }

        .transfers-card { flex-grow: 1; min-height: 0; display: flex; flex-direction: column; }
        #transfersList { flex-grow: 1; overflow-y: auto; min-height: 70px; max-height: 140px; }
        .transfer-item { margin-bottom: .5rem; padding: .5rem .65rem; border-radius: 8px; background: var(--bg); font-size: .78rem; }
        .transfer-item p { margin-bottom: .3rem; font-weight: 500; word-break: break-all; }
        .transfer-item fluent-progress { width: 100%; }
        .progress-info { display: flex; justify-content: space-between; font-size: .68rem; margin-top: .2rem; color: var(--text2); }

        .completed-card { flex-grow: 1; min-height: 0; display: flex; flex-direction: column; }
        #completedList { list-style: none; flex-grow: 1; overflow-y: auto; max-height: 160px; }
        #completedList li { background: var(--bg); padding: .4rem .65rem; border-radius: 8px; margin-bottom: .35rem; font-size: .78rem; display: flex; align-items: center; justify-content: space-between; gap: .5rem; }
        #completedList li .file-title { display: flex; align-items: center; gap: .4rem; word-break: break-all; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

        .toggle-svg { width: 1rem; height: 1rem; }

        #logPanel { position: fixed; top: 0; right: -100%; width: 100%; max-width: 400px; height: 100%; background: var(--surface); border-left: 1px solid var(--stroke); transition: right .3s ease; z-index: 100; display: flex; flex-direction: column; padding: 1rem; }
        #logPanel.open { right: 0; }
        #logPanel h2 { font-size: 1rem; text-align: center; margin-bottom: .6rem; }
        #activityLog { flex-grow: 1; background-color: var(--bg); border-radius: 8px; padding: .75rem; font-family: 'Cascadia Code', 'Consolas', monospace; font-size: .74rem; overflow-y: auto; line-height: 1.5; }
        #activityLog p { margin-bottom: .3rem; word-break: break-all; border-bottom: 1px dashed var(--stroke); padding-bottom: .15rem; }

        #toast {
            visibility: hidden; display: flex; align-items: center; justify-content: space-between; gap: .75rem;
            min-width: 16rem; max-width: 90%; color: #fff; border-radius: 10px; padding: .6rem 1rem;
            position: fixed; z-index: 110; left: 50%; top: 1rem; transform: translate(-50%, -150%);
            font-size: .85rem; font-weight: 500; opacity: 0; box-shadow: 0 8px 20px rgba(0,0,0,.3);
            transition: transform .4s cubic-bezier(.175,.885,.32,1.275), opacity .4s ease;
        }
        #toast.show { visibility: visible; transform: translate(-50%, 0); opacity: 1; }
        #toast.success { background-color: var(--success); } #toast.error { background-color: var(--error); } #toast.info { background-color: var(--accent-light); }
        .toast-content { display: flex; align-items: center; gap: .4rem; word-break: break-all; }
        #toastActionBtn { display: none; }

        .modal { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 120; }
        .modal-box { max-width: 420px; width: 90%; text-align: center; padding: 1.75rem; }
        .modal-box h2 { font-size: 1.05rem; margin-bottom: .5rem; }
        .modal-box p { font-size: .85rem; color: var(--text2); margin: .5rem 0 1rem; }
    </style>
</head>
<body>
    <fluent-design-system-provider id="dsProvider" background-color="#ffffff" accent-base-color="#0F6CBD" style="display:contents;">
    <div class="card top-navbar">
        <div class="server-brand">
            <h1 id="serverNameWrapper" title="Click to edit server name"><span id="serverName">{{ server_name }}</span></h1>
        </div>
        <div class="nav-actions">
            <fluent-button id="logToggleBtn" appearance="stealth" title="View activity log">
                <svg class="toggle-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line></svg>
            </fluent-button>
            <fluent-switch id="switch" title="Toggle dark mode"></fluent-switch>
        </div>
    </div>

    <div class="main-layout">
        <div class="left-col">
            <div class="card">
                <div class="connect-box">
                    <div class="qr-wrapper"><img src="{{ qr_code }}" id="qrCodeImg" alt="QR Code"></div>
                    <div class="connect-details">
                        <fluent-badge class="speed-badge" id="connectionSpeedBadge" appearance="accent">Auto-Speed</fluent-badge>
                        <p class="url-text" id="manualConnectInfo"><strong>{{ display_url }}</strong></p>
                        <div class="pin-pill" id="pinDisplayWrapper" title="Click to edit PIN">
                            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect><path d="M7 11V7a5 5 0 0 1 10 0v4"></path></svg>
                            PIN: <span id="pinDisplay">{{ pin }}</span>
                        </div>
                    </div>
                </div>
            </div>

            <div class="card">
                <div class="section-header">
                    <h2>Active Network</h2>
                    <fluent-button id="refreshNetBtn" appearance="stealth" title="Refresh adapters">
                        <svg class="toggle-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M23 4v6h-6"></path><path d="M1 20v-6h6"></path><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>
                    </fluent-button>
                </div>
                <select id="interfaceSelect" class="select-input"></select>
            </div>

            <div class="card">
                <div class="section-header">
                    <h2>Received Folder</h2>
                    <fluent-button id="openFolderActionBtn" appearance="outline" title="Open folder in file manager">Open</fluent-button>
                </div>
                <div class="dir-row">
                    <div class="dir-path" id="directoryDisplayWrapper" title="Click to edit path"><span id="directoryDisplay">{{ upload_folder }}</span></div>
                </div>
            </div>
        </div>

        <div class="right-col">
            <div class="card">
                <div class="section-header"><h2>Connected Devices</h2></div>
                <ul id="connectedClientsList"><li class="no-clients">Waiting for devices...</li></ul>
            </div>

            <div class="card transfers-card">
                <div class="section-header"><h2>Active Transfers</h2></div>
                <div id="transfersList"></div>
            </div>

            <div class="card completed-card">
                <div class="section-header">
                    <h2>Completed Files</h2>
                    <fluent-button id="openFolderBtn" appearance="stealth" title="Open folder">
                        <svg class="toggle-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"></path></svg>
                    </fluent-button>
                </div>
                <ul id="completedList"></ul>
            </div>
        </div>
    </div>

    <div id="logPanel"><h2>Activity Log</h2><div id="activityLog"></div></div>

    <div id="toast">
        <div class="toast-content"><span id="toast-icon"></span><span id="toastMessage"></span></div>
        <fluent-button id="toastActionBtn" appearance="stealth">Open Folder</fluent-button>
    </div>

    </fluent-design-system-provider>

    <script>
        document.addEventListener('DOMContentLoaded', function() {
            const socket = io('/server_ui', { transports: ['websocket'] });
            const elements = {
                dsProvider: document.getElementById('dsProvider'),
                activityLog: document.getElementById('activityLog'),
                serverName: document.getElementById('serverName'),
                serverNameWrapper: document.getElementById('serverNameWrapper'),
                qrCodeImg: document.getElementById('qrCodeImg'),
                manualConnectInfo: document.getElementById('manualConnectInfo'),
                pinDisplay: document.getElementById('pinDisplay'),
                pinDisplayWrapper: document.getElementById('pinDisplayWrapper'),
                directoryDisplay: document.getElementById('directoryDisplay'),
                directoryDisplayWrapper: document.getElementById('directoryDisplayWrapper'),
                openFolderActionBtn: document.getElementById('openFolderActionBtn'),
                themeSwitch: document.getElementById('switch'),
                toast: document.getElementById('toast'),
                toastIcon: document.getElementById('toast-icon'),
                toastMessage: document.getElementById('toastMessage'),
                toastActionBtn: document.getElementById('toastActionBtn'),
                logPanel: document.getElementById('logPanel'),
                logToggleBtn: document.getElementById('logToggleBtn'),
                connectedClientsList: document.getElementById('connectedClientsList'),
                transfersList: document.getElementById('transfersList'),
                completedList: document.getElementById('completedList'),
                openFolderBtn: document.getElementById('openFolderBtn'),
                interfaceSelect: document.getElementById('interfaceSelect'),
                refreshNetBtn: document.getElementById('refreshNetBtn'),
                connectionSpeedBadge: document.getElementById('connectionSpeedBadge'),
            };
            let toastTimer;
            let currentPin = elements.pinDisplay.textContent.trim();

            function openUploadsFolder() {
                if (window.__TAURI__ && window.__TAURI__.core && window.__TAURI__.core.invoke) {
                    window.__TAURI__.core.invoke('open_folder', { path: elements.directoryDisplay.textContent })
                        .then(() => showToast('Opened folder in file manager', 'info'))
                        .catch(err => { console.warn('Tauri open_folder failed, falling back to HTTP:', err); fallbackHttpOpen(); });
                } else {
                    fallbackHttpOpen();
                }
            }

            function fallbackHttpOpen() {
                fetch('/open-uploads-folder', { method: 'POST' })
                    .then(res => res.json())
                    .then(data => {
                        if (data.status === 'success') showToast('Opening folder...', 'info');
                        else showToast('Could not open folder: ' + (data.message || ''), 'error');
                    })
                    .catch(() => showToast('Error opening folder.', 'error'));
            }

            socket.on('interfaces_list', (data) => {
                const interfaces = data.interfaces || [];
                const active = data.activeAddress;
                currentPin = data.pin || currentPin;
                elements.interfaceSelect.innerHTML = '';

                interfaces.forEach(iface => {
                    const opt = document.createElement('option');
                    opt.value = iface.address;
                    opt.textContent = `${iface.speedLabel} - ${iface.address} (${iface.name})`;
                    if (iface.address === active) { opt.selected = true; updateSpeedBadge(iface); }
                    elements.interfaceSelect.appendChild(opt);
                });
            });

            elements.interfaceSelect.addEventListener('change', () => {
                socket.emit('select_interface', { address: elements.interfaceSelect.value });
            });

            elements.refreshNetBtn.addEventListener('click', () => {
                socket.emit('refresh_interfaces');
                showToast('Refreshing network adapters...', 'info');
            });

            socket.on('network_interface_changed', (data) => {
                elements.qrCodeImg.src = data.qr_code;
                elements.manualConnectInfo.innerHTML = `Or type <strong>${data.display_url}</strong> into your browser and enter PIN: <strong id="manualPin">${currentPin}</strong>`;
                showToast(`Active IP changed to ${data.activeAddress}`, 'success');
            });

            function updateSpeedBadge(iface) {
                const labels = {
                    usb: 'USB Tethering (Max Speed)',
                    hotspot: 'Direct Hotspot (P2P Wi-Fi)',
                    ethernet: 'Gigabit Ethernet (High Speed)',
                    wifi: 'Wi-Fi LAN',
                    virtual: 'Virtual Adapter',
                };
                elements.connectionSpeedBadge.textContent = labels[iface.tier] || labels.wifi;
            }

            socket.on('connect', () => console.log('Dashboard connected.'));
            socket.on('log_history', data => {
                elements.activityLog.innerHTML = '';
                (data.logs || []).forEach(msg => addLogMessage(msg, false));
                elements.activityLog.scrollTop = elements.activityLog.scrollHeight;
            });
            socket.on('log_message', data => addLogMessage(data.message));
            socket.on('server_name_updated', data => elements.serverName.textContent = data.name);
            socket.on('client_update', data => {
                const clients = data.clients || [];
                elements.connectedClientsList.innerHTML = '';
                if (clients.length > 0) {
                    clients.forEach(({ id, name }) => {
                        const li = document.createElement('li');
                        const badge = document.createElement('fluent-badge');
                        badge.setAttribute('appearance', 'outline');
                        badge.textContent = name;
                        li.appendChild(badge);

                        const sendBtn = document.createElement('fluent-button');
                        sendBtn.className = 'send-files-btn';
                        sendBtn.setAttribute('appearance', 'stealth');
                        sendBtn.title = `Send files to ${name}`;
                        sendBtn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>';
                        sendBtn.addEventListener('click', () => sendFilesToDevice(id, name));
                        li.appendChild(sendBtn);

                        elements.connectedClientsList.appendChild(li);
                    });
                } else {
                    const li = document.createElement('li');
                    li.className = 'no-clients';
                    li.textContent = 'Waiting for devices...';
                    elements.connectedClientsList.appendChild(li);
                }
            });

            // --- Send files to a connected device (native picker, Tauri-only) ---
            async function sendFilesToDevice(deviceId, deviceName) {
                if (!(window.__TAURI__ && window.__TAURI__.dialog && window.__TAURI__.dialog.open)) {
                    showToast('File picker requires the desktop app.', 'error');
                    return;
                }
                let selected;
                try {
                    selected = await window.__TAURI__.dialog.open({ multiple: true, directory: false, title: `Send files to ${deviceName}` });
                } catch (err) {
                    showToast('Could not open file picker: ' + err, 'error');
                    return;
                }
                if (!selected) return; // user cancelled
                const filePaths = Array.isArray(selected) ? selected : [selected];
                if (filePaths.length === 0) return;

                socket.emit('send_files', { deviceId, filePaths }, (res) => {
                    if (!res || res.status !== 'success') {
                        showToast((res && res.message) || 'Could not send files.', 'error');
                        return;
                    }
                    res.files.forEach(f => {
                        const item = document.createElement('div');
                        item.className = 'transfer-item';
                        item.id = `transfer-${f.transferId}`;
                        item.innerHTML = `<p>→ ${escapeHtml(f.fileName)}</p><div class="progress-info"><span class="progress-text">Waiting for ${escapeHtml(deviceName)} to accept...</span></div>`;
                        elements.transfersList.appendChild(item);
                    });
                    showToast(`Offered ${res.files.length} file(s) to ${deviceName}`, 'info');
                });
            }
            socket.on('client_connected', () => showToast('Device connected', 'info'));
            socket.on('client_disconnected', () => showToast('Device disconnected', 'info'));
            socket.on('transfer_started', data => {
                // An outgoing send already has a "waiting for accept" placeholder here
                // (same transfer_id) — upgrade it in place instead of duplicating it.
                let item = document.getElementById(`transfer-${data.transfer_id}`);
                if (!item) {
                    item = document.createElement('div');
                    item.className = 'transfer-item';
                    item.id = `transfer-${data.transfer_id}`;
                    elements.transfersList.appendChild(item);
                }
                item.innerHTML = `<p>${escapeHtml(data.fileName)}</p><fluent-progress min="0" max="100" value="0"></fluent-progress><div class="progress-info"><span class="progress-text">Starting...</span><span class="progress-percent">0%</span></div>`;
            });
            socket.on('transfer_declined', data => {
                const item = document.getElementById(`transfer-${data.transfer_id}`);
                if (item) item.remove();
                showToast(`Device declined '${truncate(data.fileName)}'`, 'error');
            });
            socket.on('transfer_progress', data => {
                const item = document.getElementById(`transfer-${data.transfer_id}`);
                if (item) {
                    const total = Number(data.total) || 0;
                    const received = Number(data.received) || 0;
                    const percent = total > 0 ? Math.min(100, Math.round((received / total) * 100)) : 100;
                    item.querySelector('fluent-progress').value = percent;
                    item.querySelector('.progress-percent').textContent = `${percent}%`;
                    item.querySelector('.progress-text').textContent = `${formatBytes(received)} / ${formatBytes(total)}`;
                }
            });
            socket.on('transfer_complete', data => {
                const item = document.getElementById(`transfer-${data.transfer_id}`);
                if (item) item.remove();

                const li = document.createElement('li');
                li.innerHTML = `<div class="file-title"><span>&#10003;</span><span>${escapeHtml(data.fileName)}</span></div>`;
                const openBtn = document.createElement('fluent-button');
                openBtn.setAttribute('appearance', 'stealth');
                openBtn.title = 'Open received folder';
                openBtn.textContent = 'Open';
                openBtn.addEventListener('click', (e) => { e.stopPropagation(); openUploadsFolder(); });
                li.appendChild(openBtn);
                elements.completedList.prepend(li);

                showToast(`'${truncate(data.fileName)}' received!`, 'success', true);
            });
            socket.on('transfer_cancelled', data => {
                const item = document.getElementById(`transfer-${data.transfer_id}`);
                if (item) item.remove();
                showToast(`'${truncate(data.fileName)}' cancelled`, 'error');
            });
            socket.on('pin_updated', data => {
                currentPin = data.pin;
                elements.pinDisplay.textContent = data.pin;
                elements.qrCodeImg.src = data.qr_code;
                elements.manualConnectInfo.innerHTML = `Or type <strong>${data.display_url}</strong> into your browser and enter PIN: <strong id="manualPin">${data.pin}</strong>`;
                showToast('PIN and QR code updated!', 'success');
            });
            socket.on('pin_update_failed', data => showToast(data.message, 'error'));
            socket.on('upload_directory_updated', data => {
                elements.directoryDisplay.textContent = data.path;
                showToast('Upload directory updated!', 'success');
            });
            socket.on('upload_directory_update_failed', data => showToast(data.message, 'error'));

            elements.serverNameWrapper.addEventListener('click', () => {
                if (elements.serverNameWrapper.querySelector('input')) return;
                const currentName = elements.serverName.textContent;
                const input = document.createElement('input');
                input.id = 'serverNameInput';
                input.value = currentName;
                elements.serverName.style.display = 'none';
                elements.serverNameWrapper.appendChild(input);
                input.focus();
                input.select();
                const save = () => {
                    const newName = input.value.trim();
                    if (newName && newName !== currentName) { socket.emit('change_server_name', { name: newName }); elements.serverName.textContent = newName; }
                    input.remove();
                    elements.serverName.style.display = 'inline';
                };
                input.addEventListener('blur', save);
                input.addEventListener('keydown', e => {
                    if (e.key === 'Enter') input.blur();
                    else if (e.key === 'Escape') {
                        // Removing a focused input fires a synchronous blur — drop the
                        // listener first so Escape actually discards instead of saving.
                        input.removeEventListener('blur', save);
                        input.remove();
                        elements.serverName.style.display = 'inline';
                    }
                });
            });

            elements.pinDisplayWrapper.addEventListener('click', () => {
                if (elements.pinDisplayWrapper.querySelector('input')) return;
                const currentPinText = elements.pinDisplay.textContent;
                const input = document.createElement('input');
                input.id = 'pinInput';
                input.value = currentPinText;
                input.type = 'tel';
                input.maxLength = 4;
                elements.pinDisplay.style.display = 'none';
                elements.pinDisplayWrapper.appendChild(input);
                input.focus();
                input.select();
                const save = () => {
                    const newPin = input.value.trim();
                    if (newPin && newPin !== currentPinText) socket.emit('change_pin', { pin: newPin });
                    input.remove();
                    elements.pinDisplay.style.display = 'inline-block';
                };
                input.addEventListener('blur', save);
                input.addEventListener('keydown', e => {
                    if (e.key === 'Enter') input.blur();
                    else if (e.key === 'Escape') {
                        input.removeEventListener('blur', save);
                        input.remove();
                        elements.pinDisplay.style.display = 'inline-block';
                    }
                });
            });

            elements.directoryDisplayWrapper.addEventListener('click', () => {
                if (elements.directoryDisplayWrapper.querySelector('input')) return;
                const currentPath = elements.directoryDisplay.textContent;
                const input = document.createElement('input');
                input.id = 'directoryInput';
                input.value = currentPath;
                elements.directoryDisplay.style.display = 'none';
                const svg = elements.directoryDisplayWrapper.querySelector('svg');
                if (svg) svg.style.display = 'none';
                elements.directoryDisplayWrapper.appendChild(input);
                input.focus();
                input.select();

                const save = () => {
                    const newPath = input.value.trim();
                    if (newPath && newPath !== currentPath) socket.emit('change_upload_directory', { path: newPath });
                    input.remove();
                    elements.directoryDisplay.style.display = 'inline-block';
                    if (svg) svg.style.display = 'inline-block';
                };

                input.addEventListener('blur', save);
                input.addEventListener('keydown', e => {
                    if (e.key === 'Enter') { input.blur(); }
                    else if (e.key === 'Escape') {
                        input.removeEventListener('blur', save);
                        input.remove();
                        elements.directoryDisplay.style.display = 'inline-block';
                        if (svg) svg.style.display = 'inline-block';
                    }
                });
            });

            elements.logToggleBtn.addEventListener('click', (e) => { e.stopPropagation(); elements.logPanel.classList.toggle('open'); });
            document.body.addEventListener('click', (e) => {
                if (elements.logPanel.classList.contains('open') && !elements.logPanel.contains(e.target) && !elements.logToggleBtn.contains(e.target)) {
                    elements.logPanel.classList.remove('open');
                }
            });

            elements.openFolderBtn.addEventListener('click', openUploadsFolder);
            elements.openFolderActionBtn.addEventListener('click', openUploadsFolder);
            elements.toastActionBtn.addEventListener('click', () => {
                openUploadsFolder();
                elements.toast.className = elements.toast.className.replace('show', '');
            });
            elements.themeSwitch.addEventListener('change', () => applyTheme(elements.themeSwitch.checked ? 'dark' : 'light'));

            function escapeHtml(str) {
                if (!str) return '';
                const div = document.createElement('div');
                div.textContent = str;
                return div.innerHTML;
            }
            function addLogMessage(message, scroll = true) {
                const p = document.createElement('p');
                p.textContent = message;
                elements.activityLog.appendChild(p);
                if (scroll) elements.activityLog.scrollTop = elements.activityLog.scrollHeight;
            }
            function showToast(message, type = 'info', showAction = false) {
                clearTimeout(toastTimer);
                elements.toastIcon.textContent = { success: '✓', info: 'ℹ', error: '✕' }[type] || 'ℹ';
                elements.toastMessage.textContent = message;
                elements.toastActionBtn.style.display = showAction ? 'inline-flex' : 'none';
                elements.toast.className = `show ${type}`;
                const duration = showAction ? 6000 : 4000;
                toastTimer = setTimeout(() => { elements.toast.className = elements.toast.className.replace('show', ''); }, duration);
            }
            function applyTheme(theme) {
                document.body.setAttribute('data-theme', theme);
                elements.themeSwitch.checked = theme === 'dark';
                if (elements.dsProvider) {
                    elements.dsProvider.setAttribute('background-color', theme === 'dark' ? '#1b1b1b' : '#ffffff');
                    elements.dsProvider.setAttribute('accent-base-color', theme === 'dark' ? '#479ef5' : '#0f6cbd');
                    // Without this, Fluent's neutral-foreground ramp (used for outline/stealth
                    // button text) stays anchored to light-mode luminance no matter what
                    // background-color is set to, rendering that text black on a dark card.
                    elements.dsProvider.setAttribute('base-layer-luminance', theme === 'dark' ? '0' : '1');
                }
                localStorage.setItem('theme', theme);
            }
            function formatBytes(bytes, d = 2) {
                const num = Number(bytes) || 0;
                if (num === 0) return '0 Bytes';
                const k = 1024;
                const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(num) / Math.log(k));
                return parseFloat((num / Math.pow(k, i)).toFixed(d < 0 ? 0 : d)) + ' ' + sizes[i];
            }
            function truncate(str, len = 20) {
                if (!str) return '';
                return str.length <= len ? str : str.slice(0, len - 3) + '...';
            }

            const preferDark = window.matchMedia('(prefers-color-scheme: dark)');
            const savedTheme = localStorage.getItem('theme');
            applyTheme(savedTheme ? savedTheme : (preferDark.matches ? 'dark' : 'light'));
            preferDark.addEventListener('change', e => {
                if (!localStorage.getItem('theme')) applyTheme(e.matches ? 'dark' : 'light');
            });
        });
    </script>
</body>
</html>
